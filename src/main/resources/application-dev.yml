server:
  servlet:
    context-path: /api/travel-blog
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

spring:
  application:
    name: travel-blog

  datasource:
    url: jdbc:postgresql://localhost:5432/travel_blog
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
#change if deploy
    secret: change-me-should-be-very-long-secret-at-least-32-chars
    expiration-ms: 86400000

